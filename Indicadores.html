<style>
:root{

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 'Nunito Sans','Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1280px;margin:0 auto;padding:0 20px 60px}
header{background:linear-gradient(135deg,#5f2879,#3d1654 60%,#5f2879);color:#fff;padding:26px 0 22px;margin-bottom:22px}

header .wrap{padding-bottom:0}
.brand{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:#b9cbe8;font-weight:600}
h1{margin:6px 0 4px;font-size:25px;font-weight:650;letter-spacing:-.01em}
.sub{color:#c3d3ec;font-size:13.5px;margin:0}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}
.kpi{background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.16);border-radius:10px;padding:11px 13px}
.kpi b{display:block;font-size:22px;font-weight:650;line-height:1.2}
.kpi span{font-size:11.5px;color:#c3d3ec}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 16px}
.lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-right:4px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:20px;padding:6px 14px;font-size:13px;cursor:pointer;transition:.15s;font-weight:500}
.chip:hover{border-color:var(--accent);color:var(--ink)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
@media (prefers-color-scheme:dark){.chip.on{background:var(--blue);border-color:var(--blue);color:#0f1420}}
.ejehead{display:flex;align-items:center;gap:10px;margin:26px 0 12px}
.ejehead .dot{width:11px;height:11px;border-radius:3px}
.ejehead h2{font-size:15px;margin:0;font-weight:650}
.ejehead .cnt{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px 16px 13px;cursor:pointer;transition:.18s;box-shadow:var(--shadow);position:relative;border-top:3px solid var(--ec)}
.card:hover{transform:translateY(-2px);box-shadow:0 2px 6px rgba(22,35,58,.1),0 12px 28px rgba(22,35,58,.12)}
.card .ficha{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.card h3{margin:3px 0 10px;font-size:14px;font-weight:600;line-height:1.3;min-height:52px}
.card .val{font-size:27px;font-weight:700;line-height:1;color:var(--ink)}
.card .yr{display:inline-block;margin-top:5px;font-size:11px;font-weight:600;color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);border-radius:5px;padding:2px 7px}
.card .src{font-size:11px;color:var(--muted);margin-top:9px;border-top:1px solid var(--line);padding-top:7px}
.spark{display:block;margin:10px 0 2px}
/* detalle */
.back{background:none;border:0;color:var(--accent);font-size:13.5px;cursor:pointer;padding:0;margin-bottom:14px;font-weight:600}
.dwrap{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.dhead{padding:20px 22px;border-bottom:1px solid var(--line);background:var(--panel2)}
.dhead .ficha{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.dhead h2{margin:4px 0 2px;font-size:19px;font-weight:650}
.dhead .rt{font-size:12.5px;color:var(--muted)}
.dbig{display:flex;gap:28px;flex-wrap:wrap;align-items:baseline;padding:18px 22px 6px}
.dbig .v{font-size:40px;font-weight:750;line-height:1}
.dbig .y{font-size:13px;color:var(--accent);font-weight:600}
.sect{padding:10px 22px 20px}
.sect h4{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:650;margin:14px 0 8px}
dl.tec{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13.5px;margin:0}
dl.tec dt{color:var(--muted)}
dl.tec dd{margin:0;font-weight:500}
table.rk{width:100%;border-collapse:collapse;font-size:13px}
table.rk td{padding:4px 6px;border-bottom:1px solid var(--line)}
table.rk td:last-child{text-align:right;font-weight:600}
.muted{color:var(--muted);font-size:12.5px}
.footer{margin-top:30px;color:var(--muted);font-size:12px;text-align:center}
</style></head>

function spark(s,color,w=268,h=38){if(s.length<2)return '';
 const vs=s.map(p=>p.v),mn=Math.min(...vs),mx=Math.max(...vs),rg=(mx-mn)||1;
 const X=i=>3+i*(w-6)/(s.length-1),Y=v=>h-4-((v-mn)/rg)*(h-10);
 const d=s.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.v).toFixed(1)).join(' ');
 const g='g'+Math.random().toString(36).slice(2,7);
 return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><defs><linearGradient id="${g}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".22"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs><path d="${d} L${X(s.length-1).toFixed(1)} ${h} L${X(0).toFixed(1)} ${h} Z" fill="url(#${g})"/><path d="${d}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${X(s.length-1).toFixed(1)}" cy="${Y(s[s.length-1].v).toFixed(1)}" r="2.8" fill="${color}"/></svg>`;}
function linea(s,color,ind,w=620,h=230){if(s.length<2)return '<p class="muted">Sin serie histórica.</p>';
 const P={t:14,r:16,b:28,l:54};const vs=s.map(p=>p.v);let mn=Math.min(...vs),mx=Math.max(...vs);
 const pad=((mx-mn)||Math.abs(mx)*.1||1)*.16;mn=Math.max(0,mn-pad);mx+=pad;
 const X=i=>P.l+i*(w-P.l-P.r)/(s.length-1),Y=v=>P.t+(1-(v-mn)/((mx-mn)||1))*(h-P.t-P.b);
 let g='';for(let k=0;k<=4;k++){const v=mn+(mx-mn)*k/4,y=Y(v);g+=`<line x1="${P.l}" y1="${y.toFixed(1)}" x2="${w-P.r}" y2="${y.toFixed(1)}" stroke="${cssv('--line')}"/><text x="${P.l-8}" y="${(y+4).toFixed(1)}" text-anchor="end" font-size="10" fill="${cssv('--muted')}">${fmt(v,ind)}</text>`;}
 const step=Math.max(1,Math.ceil(s.length/8));s.forEach((p,i)=>{if(i%step===0||i===s.length-1)g+=`<text x="${X(i).toFixed(1)}" y="${h-8}" text-anchor="middle" font-size="10" fill="${cssv('--muted')}">${p.a}</text>`;});
 const d=s.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.v).toFixed(1)).join(' ');
 const pts=s.map((p,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="${i===s.length-1?4:2.6}" fill="${i===s.length-1?color:cssv('--panel')}" stroke="${color}" stroke-width="1.7"><title>${p.a}: ${fmt(p.v,ind)}</title></circle>`).join('');
 return `<svg width="100%" viewBox="0 0 ${w} ${h}" style="max-width:${w}px">${g}<path d="${d}" fill="none" stroke="${color}" stroke-width="2.1" stroke-linejoin="round"/>${pts}</svg>`;}
function barras(items,color,ind,w=560){if(!items.length)return '';
 const mx=Math.max(...items.map(i=>i.v))||1,bh=25,h=items.length*bh+4;let g='';
 items.forEach((it,i)=>{const bw=Math.max(2,(it.v/mx)*(w-285));
  g+=`<rect x="200" y="${i*bh+5}" width="${bw.toFixed(1)}" height="14" rx="3" fill="${color}" opacity="${(.5+.5*(it.v/mx)).toFixed(2)}"/><text x="192" y="${i*bh+16}" text-anchor="end" font-size="11.5" fill="${cssv('--ink')}">${(it.cat||'').length>26?it.cat.slice(0,25)+'…':it.cat}</text><text x="${(200+bw+7).toFixed(1)}" y="${i*bh+16}" font-size="11.5" font-weight="600" fill="${cssv('--ink')}">${fmt(it.v,ind)}</text>`;});
 return `<svg width="100%" viewBox="0 0 ${w} ${h}" style="max-width:${w}px">${g}</svg>`;}

let filtro=0;
function kpis(){const anios=D.indicadores.map(i=>i.anio);
 document.getElementById('kpis').innerHTML=
 `<div class="kpi"><b>${D.indicadores.length}</b><span>indicadores con dato</span></div>
  <div class="kpi"><b>3</b><span>ejes estratégicos</span></div>
  <div class="kpi"><b>${Math.min(...anios)}–${Math.max(...anios)}</b><span>rango del último dato · nivel nacional</span></div>
  <div class="kpi"><b>${D.meta.actualizado.split('-').reverse().join('/')}</b><span>actualización</span></div>`;}
function chips(){const c=document.getElementById('chips');const o=[[0,'Todos'],[1,'Eje 1'],[2,'Eje 2'],[3,'Eje 3']];
 c.innerHTML=o.map(([v,t])=>`<button class="chip ${v===filtro?'on':''}" data-f="${v}">${t}</button>`).join(' ');
 c.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{filtro=+b.dataset.f;chips();home();});}
function card(ind){const c='var('+EC[ind.eje]+')';const s=serie(ind.id);
 return `<div class="card" style="--ec:${c}" data-id="${ind.id}"><div class="ficha">Ficha ${ind.ficha}</div>
  <h3>${ind.nombre}</h3><div class="val">${fmt(ind.valor,ind)}</div><span class="yr">Dato ${ind.anio}</span>
  ${spark(s,c)}<div class="src">${ind.fuente}</div></div>`;}
function home(){document.getElementById('detail').style.display='none';const el=document.getElementById('home');el.style.display='';
 let html='';[1,2,3].forEach(ej=>{if(filtro&&filtro!==ej)return;
  const list=D.indicadores.filter(i=>i.eje===ej);if(!list.length)return;
  const enom=D.ejes.find(e=>e.id===ej).nombre;
  html+=`<div class="ejehead"><span class="dot" style="background:var(${EC[ej]})"></span><h2>Eje ${ej}. ${enom}</h2><span class="cnt">${list.length} indicadores</span></div><div class="grid">${list.map(card).join('')}</div>`;});
 el.innerHTML=html;
 el.querySelectorAll('.card').forEach(x=>x.onclick=()=>detalle(x.dataset.id));}
function detalle(id){const ind=IX[id];const c='var('+EC[ind.eje]+')';const s=serie(id);
 const dg=desag(id,ind.anio);const tipos=[...new Set(dg.map(d=>d.tipo))];
 const dp=deps(id,ind.anio);
 let dgh='';tipos.forEach(tp=>{const it=dg.filter(d=>d.tipo===tp).map(d=>({cat:d.cat,v:d.v}));
  dgh+=`<h4>${tp} · ${ind.anio}</h4>${barras(it,cssv(EC[ind.eje]),ind)}`;});
 let dph='';if(dp.length){const top=dp.slice(0,5),bot=dp.slice(-5).reverse();
  const row=a=>a.map(d=>`<tr><td>${d.cat}</td><td>${fmt(d.v,ind)}</td></tr>`).join('');
  dph=`<h4>Departamentos · ${ind.anio}</h4><div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
   <div><div class="muted" style="margin-bottom:4px">Más altos</div><table class="rk">${row(top)}</table></div>
   <div><div class="muted" style="margin-bottom:4px">Más bajos</div><table class="rk">${row(bot)}</table></div></div>`;}
 const rutas=ind.rutas.map(r=>'Ruta '+r).join(', ');
 const el=document.getElementById('detail');document.getElementById('home').style.display='none';el.style.display='';
 el.innerHTML=`<button class="back">‹ Volver a todos los indicadores</button>
  <div class="dwrap"><div class="dhead"><div class="ficha">Ficha ${ind.ficha} · Eje ${ind.eje}</div><h2>${ind.nombre}</h2>
   <div class="rt">${rutas}</div></div>
   <div class="dbig"><div><div class="v" style="color:${c}">${fmt(ind.valor,ind)}</div></div><div class="y">Último dato disponible · ${ind.anio} · Colombia (nacional)</div></div>
   <div class="sect">
    ${dgh?('<div>'+dgh+'</div>'):''}
    ${dph}
    <h4>Serie histórica <span style="text-transform:none;font-weight:500;color:var(--muted)">(referencia)</span></h4>${linea(s,cssv(EC[ind.eje]),ind)}
    <h4>Ficha técnica</h4>
    <dl class="tec"><dt>Indicador</dt><dd>${ind.corto}</dd><dt>Último dato</dt><dd>${fmt(ind.valor,ind)} (${ind.anio})</dd>
     <dt>Fuente</dt><dd>${ind.fuente}</dd><dt>Eje</dt><dd>Eje ${ind.eje}. ${D.ejes.find(e=>e.id===ind.eje).nombre}</dd>
     <dt>Rutas asociadas</dt><dd>${ind.rutas.map(r=>'Ruta '+r+'. '+(RX[r]?RX[r].nombre:'')).join('<br>')}</dd>
     <dt>Sentido</dt><dd>${ind.sentido==='baja'?'Menor es mejor':(ind.sentido==='sube'?'Mayor es mejor':'Sin sentido definido')}</dd></dl>
   </div></div>`;
 el.querySelector('.back').onclick=()=>{home();window.scrollTo(0,0);};window.scrollTo(0,0);}
document.getElementById('foot').textContent='IV PNDE 2026-2035 · '+D.meta.fuente+' · '+D.indicadores.length+' indicadores';
kpis();chips();home();
</script></body></html>
